
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17221b">
<title>Museum of Patches</title>

<script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#17221b;color:#eee9dc;font-family:Georgia,serif}
header{padding:24px 15px;text-align:center;background:#202f25;border-bottom:1px solid #806d46}
header h1{font-size:25px;letter-spacing:3px;margin:0}
header p{color:#c7ad70;font:11px Arial;letter-spacing:3px}
main{max-width:1000px;margin:auto;padding:22px}
.hero{min-height:300px;padding:45px 20px;display:flex;align-items:center;background:linear-gradient(90deg,#101a13ef,#17251bd9);border:1px solid #71613f;text-align:center;justify-content:center}
.hero h2{font-size:35px;font-weight:normal}
.hero p{color:#c7ad70;font:13px Arial;letter-spacing:2px}
.photo{border:1px dashed #a58c57;padding:12px;margin-top:20px;font:12px Arial;color:#d4c394}
h3.section{font-size:19px;font-weight:normal;letter-spacing:2px;margin:35px 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.card{background:#26372b;border:1px solid #4b5948;padding:25px 18px;color:#eee9dc;text-align:left;cursor:pointer;border-radius:5px;min-height:145px;font-family:Georgia,serif}
.card:hover{border-color:#c7ad70;background:#304433}
.flag{font-size:35px}
.card h2{font-size:21px;font-weight:normal;margin:12px 0 5px}
.card p{font:13px Arial;color:#c0c3b8;margin:0}
.page-title{font-size:32px;font-weight:normal;margin:15px 0}
.back{background:none;border:0;color:#c7ad70;padding:12px 0;cursor:pointer;font-size:15px}
.category{min-height:140px}
.category h2{font-size:20px}
.country-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.country-card{text-align:center;padding:15px 10px}
.map{height:115px;background:#1c2c21;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border-radius:3px;overflow:hidden;color:#b9b8aa;font:12px Arial}
.map svg{width:140px;height:100px;overflow:visible}
.map svg path{fill:#a18c5d;stroke:#d1bd8c;stroke-width:1.2;stroke-linejoin:round}
.notice{margin-top:25px;padding:17px;border:1px dashed #53604e;color:#b9b8aa;font:13px/1.6 Arial}
footer{text-align:center;padding:25px;color:#9b9b8e;font:11px Arial;letter-spacing:2px;border-top:1px solid #465345;margin-top:40px}
@media(min-width:700px){
.grid{grid-template-columns:repeat(4,1fr)}
.country-grid{grid-template-columns:repeat(3,1fr)}
.hero{min-height:370px}
}
</style>
</head>

<body>
<header>
<h1>MUSEUM OF PATCHES</h1>
<p>WORLD MILITARY COLLECTIONS</p>
</header>

<main id="app"></main>

<footer>COLECCIONES MILITARES DEL MUNDO</footer>

<script>
const app=document.getElementById("app");

const categorias=[
["Medallas","🏅","Condecoraciones y medallas"],
["Parches","⬟","Parches de unidades militares"],
["Insignias","⚜","Distintivos y emblemas"],
["Otros","◇","Otras piezas de colección"]
];

const paises=[
["Afganistán","🇦🇫","004"],
["Alemania","🇩🇪","276"],
["Bulgaria","🇧🇬","100"],
["Eslovaquia","🇸🇰","703"],
["España","🇪🇸","724"],
["Estados Unidos de América","🇺🇸","840"],
["Francia","🇫🇷","250"],
["Italia","🇮🇹","380"],
["Kuwait","🇰🇼","414"],
["Líbano","🇱🇧","422"],
["Palestina","🇵🇸","275"],
["Perú","🇵🇪","604"],
["Reino Unido","🇬🇧","826"],
["Rusia","🇷🇺","643"],
["Ucrania","🇺🇦","804"]
];

const organizaciones=[
["OTAN","🛡️"]
];

function obtenerBandera(nombre){
const encontrado=paises.find(p=>p[0]===nombre);
if(encontrado)return encontrado[1];
const organizacion=organizaciones.find(o=>o[0]===nombre);
if(organizacion)return organizacion[1];
return "🌍";
}

let mundoPromise=null;

function dibujarMapas(){
if(!mundoPromise){
mundoPromise=fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
.then(respuesta=>{
if(!respuesta.ok)throw new Error("No se pudieron descargar los mapas");
return respuesta.json();
})
.then(mundo=>topojson.feature(mundo,mundo.objects.countries).features);
}

mundoPromise.then(features=>{
document.querySelectorAll(".map[data-code]").forEach(contenedor=>{
const codigo=contenedor.dataset.code;
const pais=features.find(feature=>String(feature.id).padStart(3,"0")===codigo);

if(!pais){
contenedor.innerHTML="Mapa no disponible";
return;
}

const proyeccion=d3.geoNaturalEarth1().fitSize([130,85],pais);
const dibujar=d3.geoPath(proyeccion);
const ruta=dibujar(pais);

if(!ruta){
contenedor.innerHTML="Mapa no disponible";
return;
}

contenedor.innerHTML=`
<svg viewBox="0 0 130 85" role="img" aria-label="Mapa geográfico">
<path d="${ruta}"></path>
</svg>`;
});
}).catch(error=>{
console.error("Error cargando mapas:",error);
document.querySelectorAll(".map").forEach(mapa=>{
mapa.innerHTML="Error al cargar el mapa";
});
});
}

function inicio(){
app.innerHTML=`
<section class="hero">
<div>
<p>HISTORIA · COLECCIONISMO · CULTURA MILITAR</p>
<h2>Condecoraciones e insignias militares del mundo</h2>
<p>UN VIAJE POR LAS COLECCIONES MILITARES INTERNACIONALES</p>
<div class="photo">AQUÍ COLOCAREMOS UNA FOTOGRAFÍA REAL DE TUS PARCHES</div>
</div>
</section>
<h3 class="section">EXPLORAR COLECCIONES</h3>
<div class="grid">
<button class="card" onclick="pais('Ucrania')">
<span class="flag">🇺🇦</span>
<h2>Ucrania</h2>
<p>Acceder a la colección</p>
</button>
<button class="card" onclick="otrosPaises()">
<span class="flag">🌍</span>
<h2>Otros países</h2>
<p>Colección internacional</p>
</button>
</div>`;
}

function pais(nombre){
const bandera=obtenerBandera(nombre);
app.innerHTML=`
<button class="back" onclick="inicio()">← Inicio</button>
<p>${bandera} COLECCIÓN NACIONAL</p>
<h2 class="page-title">${nombre}</h2>
<p>Selecciona una categoría:</p>
<div class="grid">
${categorias.map(c=>`
<button class="card category" onclick="categoria('${nombre}','${c[0]}')">
<span class="flag">${c[1]}</span>
<h2>${c[0]}</h2>
<p>${c[2]}</p>
</button>`).join("")}
</div>`;
}

function otrosPaises(){
app.innerHTML=`
<button class="back" onclick="inicio()">← Inicio</button>
<p>COLECCIÓN INTERNACIONAL</p>
<h2 class="page-title">Otros países</h2>
<p>Selecciona un país:</p>
<div class="country-grid">
${paises.map(p=>`
<button class="card country-card" onclick="pais('${p[0]}')">
<div class="map" data-code="${p[2]}">Cargando mapa...</div>
<h2>${p[1]} ${p[0]}</h2>
<p>Ver colección →</p>
</button>`).join("")}
</div>
<h3 class="section">ORGANIZACIONES INTERNACIONALES</h3>
<div class="grid">
${organizaciones.map(o=>`
<button class="card" onclick="pais('${o[0]}')">
<span class="flag">${o[1]}</span>
<h2>${o[0]}</h2>
<p>Organización internacional</p>
</button>`).join("")}
</div>
<div class="notice">Añadiremos más países conforme incorporemos nuevas colecciones.</div>`;
dibujarMapas();
}

function categoria(nombre,cat){
const bandera=obtenerBandera(nombre);
app.innerHTML=`
<button class="back" onclick="pais('${nombre}')">← Volver a ${nombre}</button>
<p>COLECCIÓN · ${nombre.toUpperCase()}</p>
<h2 class="page-title">${cat}</h2>
<div class="notice">
Esta sección está preparada. En la siguiente fase incorporaremos las piezas, fotografías y fichas históricas de la colección.
</div>`;
}

inicio();
</script>
</body>
</html>
