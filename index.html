
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17221b">

<title>Museo de Parches</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#17221b;
  color:#eee9dc;
  font-family:Georgia,serif;
}

/* CABECERA */

header{
  padding:25px 15px;
  text-align:center;
  background:#202f25;
  border-bottom:1px solid #806d46;
}

header h1{
  font-size:26px;
  letter-spacing:3px;
  margin:0;
}

header p{
  color:#c7ad70;
  font:11px Arial;
  letter-spacing:3px;
}

/* CONTENIDO */

main{
  max-width:1000px;
  margin:auto;
  padding:22px;
}

/* PORTADA */

.hero{
  min-height:320px;
  padding:45px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#101a13,#26372b);
  border:1px solid #71613f;
  text-align:center;
}

.hero h2{
  font-size:35px;
  font-weight:normal;
  line-height:1.3;
}

.hero p{
  color:#c7ad70;
  font:13px Arial;
  letter-spacing:2px;
  line-height:1.7;
}

.photo{
  border:1px dashed #a58c57;
  padding:22px 12px;
  margin-top:25px;
  font:12px Arial;
  color:#d4c394;
}

/* TÍTULOS */

h3.section{
  font-size:19px;
  font-weight:normal;
  letter-spacing:2px;
  margin:35px 0 18px;
}

.page-title{
  font-size:32px;
  font-weight:normal;
  margin:15px 0;
}

/* CUADRÍCULAS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.country-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* TARJETAS */

.card{
  background:#26372b;
  border:1px solid #4b5948;
  padding:25px 15px;
  color:#eee9dc;
  text-align:center;
  cursor:pointer;
  border-radius:5px;
  min-height:150px;
  font-family:Georgia,serif;
  transition:background .2s,border-color .2s;
}

.card:hover{
  border-color:#c7ad70;
  background:#304433;
}

.card:active{
  background:#394c3b;
}

/* BANDERAS */

.flag{
  font-size:48px;
  line-height:1.3;
  display:block;
}

.card h2{
  font-size:21px;
  font-weight:normal;
  margin:12px 0 7px;
  line-height:1.3;
}

.card p{
  font:13px Arial;
  color:#c0c3b8;
  margin:0;
}

/* TARJETAS DE PAÍSES */

.country-card{
  min-height:155px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:20px 10px;
}

.country-card .flag{
  font-size:53px;
  margin-bottom:5px;
}

.country-card h2{
  font-size:18px;
  margin:5px 0;
}

.country-card p{
  color:#c7ad70;
}

/* BOTÓN VOLVER */

.back{
  background:none;
  border:0;
  color:#c7ad70;
  padding:12px 0;
  cursor:pointer;
  font-size:15px;
  font-family:Georgia,serif;
}

/* CATEGORÍAS */

.category{
  min-height:150px;
}

.category h2{
  font-size:20px;
}

/* AVISOS */

.notice{
  margin-top:25px;
  padding:17px;
  border:1px dashed #53604e;
  color:#b9b8aa;
  font:13px/1.7 Arial;
}

/* PIE DE PÁGINA */

footer{
  text-align:center;
  padding:25px;
  color:#9b9b8e;
  font:11px Arial;
  letter-spacing:2px;
  border-top:1px solid #465345;
  margin-top:40px;
}

/* ORDENADOR */

@media(min-width:700px){

  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  .country-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .hero{
    min-height:380px;
  }

  .hero h2{
    font-size:42px;
  }

}

/* MÓVILES PEQUEÑOS */

@media(max-width:360px){

  main{
    padding:14px;
  }

  .country-grid{
    gap:9px;
  }

  .country-card{
    padding:15px 5px;
  }

  .country-card h2{
    font-size:16px;
  }

}

</style>
</head>

<body>

<header>

  <h1>MUSEO DE PARCHES</h1>

  <p>COLECCIONES MILITARES DEL MUNDO</p>

</header>


<main id="app"></main>


<footer>

  MUSEO DE PARCHES · COLECCIONISMO MILITAR

</footer>


<script>

/* ==================================
   ELEMENTO PRINCIPAL
================================== */

const app=document.getElementById("app");


/* ==================================
   CATEGORÍAS
================================== */

const categorias=[

  ["Medallas","🏅","Condecoraciones y medallas"],

  ["Parches","⬟","Parches de unidades militares"],

  ["Insignias","⚜","Distintivos y emblemas"],

  ["Otros","◇","Otras piezas de colección"]

];


/* ==================================
   PAÍSES
   Nombre / Bandera / Código
================================== */

const paises=[

  ["Afganistán","🇦🇫","004"],

  ["Alemania","🇩🇪","276"],

  ["Bulgaria","🇧🇬","100"],

  ["Eslovaquia","🇸🇰","703"],

  ["España","🇪🇸","724"],

  ["Estados Unidos de América","🇺🇸","840"],

  ["Francia","🇫🇷","250"],

  ["Italia","🇮🇹","380"],

  ["Kuwait","🇰🇼","414"],

  ["Líbano","🇱🇧","422"],

  ["Palestina","🇵🇸","275"],

  ["Perú","🇵🇪","604"],

  ["Reino Unido","🇬🇧","826"],

  ["Rusia","🇷🇺","643"],

  ["Ucrania","🇺🇦","804"]

];


/* ==================================
   ORGANIZACIONES
================================== */

const organizaciones=[

  ["OTAN","🛡️"]

];


/* ==================================
   OBTENER BANDERA
================================== */

function obtenerBandera(nombre){

  const encontrado=paises.find(p=>p[0]===nombre);

  if(encontrado){

    return encontrado[1];

  }

  const organizacion=organizaciones.find(o=>o[0]===nombre);

  if(organizacion){

    return organizacion[1];

  }

  return "🌍";

}


/* ==================================
   INICIO DEL MUSEO
================================== */

function inicio(){

  app.innerHTML=`

    <section class="hero">

      <div>

        <p>
          HISTORIA · COLECCIONISMO · CULTURA MILITAR
        </p>

        <h2>
          Condecoraciones e insignias militares del mundo
        </h2>

        <p>
          UN VIAJE POR LAS COLECCIONES MILITARES INTERNACIONALES
        </p>

        <div class="photo">

          AQUÍ COLOCAREMOS UNA FOTOGRAFÍA REAL DE TU COLECCIÓN

        </div>

      </div>

    </section>


    <h3 class="section">
      EXPLORAR COLECCIONES
    </h3>


    <div class="grid">

      <button class="card" onclick="pais('Ucrania')">

        <span class="flag">🇺🇦</span>

        <h2>Ucrania</h2>

        <p>Acceder a la colección</p>

      </button>


      <button class="card" onclick="otrosPaises()">

        <span class="flag">🌍</span>

        <h2>Otros países</h2>

        <p>Colección internacional</p>

      </button>

    </div>

  `;

}


/* ==================================
   PÁGINA DE UN PAÍS
================================== */

function pais(nombre){

  const bandera=obtenerBandera(nombre);

  app.innerHTML=`

    <button class="back" onclick="inicio()">

      ← Inicio

    </button>


    <p>${bandera} COLECCIÓN NACIONAL</p>


    <h2 class="page-title">

      ${nombre}

    </h2>


    <p>Selecciona una categoría:</p>


    <div class="grid">

      ${categorias.map(c=>`

        <button
          class="card category"
          onclick="categoria('${nombre}','${c[0]}')"
        >

          <span class="flag">${c[1]}</span>

          <h2>${c[0]}</h2>

          <p>${c[2]}</p>

        </button>

      `).join("")}

    </div>

  `;

}


/* ==================================
   OTROS PAÍSES
================================== */

function otrosPaises(){

  app.innerHTML=`

    <button class="back" onclick="inicio()">

      ← Inicio

    </button>


    <p>COLECCIÓN INTERNACIONAL</p>


    <h2 class="page-title">

      Otros países

    </h2>


    <p>Selecciona un país:</p>


    <div class="country-grid">

      ${paises

        .filter(p=>p[0]!=="Ucrania")

        .map(p=>`

          <button
            class="card country-card"
            onclick="pais('${p[0]}')"
          >

            <span class="flag">${p[1]}</span>

            <h2>${p[0]}</h2>

            <p>Ver colección →</p>

          </button>

        `).join("")}

    </div>


    <h3 class="section">

      ORGANIZACIONES INTERNACIONALES

    </h3>


    <div class="grid">

      ${organizaciones.map(o=>`

        <button
          class="card"
          onclick="pais('${o[0]}')"
        >

          <span class="flag">${o[1]}</span>

          <h2>${o[0]}</h2>

          <p>Organización internacional</p>

        </button>

      `).join("")}

    </div>


    <div class="notice">

      Añadiremos nuevos países y organizaciones conforme
      incorporemos nuevas colecciones al museo.

    </div>

  `;

}


/* ==================================
   PÁGINA DE CATEGORÍAS
================================== */

function categoria(nombre,cat){

  const bandera=obtenerBandera(nombre);

  app.innerHTML=`

    <button
      class="back"
      onclick="pais('${nombre}')"
    >

      ← Volver a ${nombre}

    </button>


    <p>

      COLECCIÓN · ${nombre.toUpperCase()}

    </p>


    <h2 class="page-title">

      ${cat}

    </h2>


    <div class="notice">

      Esta sección está preparada.

      En la siguiente fase incorporaremos las piezas,
      fotografías y fichas históricas de la colección.

    </div>

  `;

}


/* ==================================
   ARRANCAR EL MUSEO
================================== */

inicio();

</script>

</body>
</html>
