
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Museo de Parches</title>
<style>
:root{
  --fondo:#17221b;
  --cabecera:#202f25;
  --tarjeta:#26372b;
  --tarjeta2:#304434;
  --oro:#c7ad70;
  --texto:#f1eee5;
  --secundario:#b9c1b7;
  --borde:#435545;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--fondo);color:var(--texto);
  font-family:Georgia,"Times New Roman",serif;
}
header{
  background:var(--cabecera);border-bottom:2px solid var(--oro);
  padding:25px 15px;text-align:center;
}
header h1{
  margin:0;color:var(--oro);
  font-size:clamp(25px,5vw,38px);letter-spacing:2px;
}
header p{
  margin:8px 0 0;color:var(--secundario);
  font-size:13px;letter-spacing:2px;
}
main{max-width:1100px;min-height:70vh;margin:auto;padding:25px 16px 45px}
footer{
  padding:22px 12px;text-align:center;color:var(--secundario);
  border-top:1px solid var(--borde);font-size:12px;
}
h2{color:var(--oro);margin-top:0}
.hero{text-align:center;padding:30px 10px 35px}
.hero h2{font-size:28px;letter-spacing:1px}
.hero p,.intro{
  max-width:650px;margin:15px auto;color:var(--secundario);line-height:1.6;
}
.seccion-titulo{
  margin:30px 0 15px;padding-bottom:10px;
  border-bottom:1px solid var(--borde);color:var(--oro);font-size:21px;
}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;
}
.tarjeta{
  background:var(--tarjeta);border:1px solid var(--borde);
  border-radius:10px;padding:22px 17px;min-height:135px;
  cursor:pointer;transition:.2s;text-align:left;color:var(--texto);
  font-family:inherit;width:100%;text-decoration:none;display:block;
}
.tarjeta:hover{
  transform:translateY(-3px);background:var(--tarjeta2);
  border-color:var(--oro);
}
.tarjeta .icono{display:block;font-size:30px;margin-bottom:12px}
.tarjeta h3{margin:0 0 8px;color:var(--oro);font-size:19px}
.tarjeta p{margin:0;color:var(--secundario);font-size:13px;line-height:1.5}
.boton-volver{
  display:inline-block;background:var(--tarjeta);border:1px solid var(--borde);
  color:var(--texto);padding:10px 16px;border-radius:7px;
  cursor:pointer;font-family:inherit;font-size:14px;margin-bottom:22px;
}
.boton-volver:hover{border-color:var(--oro);color:var(--oro)}
.breadcrumb{color:var(--secundario);font-size:13px;margin-bottom:18px}
.breadcrumb span{color:var(--oro)}
.pais-cabecera{text-align:center;padding:15px 0 25px}
.pais-bandera{font-size:55px;display:block;margin-bottom:10px}
.aviso{
  background:#202f25;border:1px solid var(--borde);
  border-left:3px solid var(--oro);border-radius:7px;
  padding:18px;color:var(--secundario);line-height:1.6;margin-top:18px;
}
@media(max-width:600px){
  main{padding:20px 12px 35px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tarjeta{padding:16px 12px;min-height:125px}
  .tarjeta h3{font-size:16px}
  .tarjeta p{font-size:12px}
  .tarjeta .icono{font-size:26px}
}
</style>
</head>

<body>
<header>
  <h1>MUSEO DE PARCHES</h1>
  <p>COLECCIONES MILITARES DEL MUNDO</p>
</header>

<main id="app"></main>

<footer>
  MUSEO DE PARCHES · COLECCIONES MILITARES DEL MUNDO
</footer>

<script>
const app=document.getElementById("app");

const categorias=[
  ["Medallas","🏅","Condecoraciones y medallas"],
  ["Parches","⬟","Parches de unidades militares"],
  ["Insignias","⚜","Distintivos y emblemas"],
  ["Otros","◇","Otras piezas de colección"]
];

const paises=[
  ["Afganistán","🇦🇫","004"],
  ["Alemania","🇩🇪","276"],
  ["Bulgaria","🇧🇬","100"],
  ["Eslovaquia","🇸🇰","703"],
  ["España","🇪🇸","724"],
  ["Estados Unidos de América","🇺🇸","840"],
  ["Francia","🇫🇷","250"],
  ["Italia","🇮🇹","380"],
  ["Kuwait","🇰🇼","414"],
  ["Líbano","🇱🇧","422"],
  ["Palestina","🇵🇸","275"],
  ["Perú","🇵🇪","604"],
  ["Reino Unido","🇬🇧","826"],
  ["Rusia","🇷🇺","643"],
  ["Ucrania","🇺🇦","804"]
];

const organizaciones=[["OTAN","🛡️"]];

function escapar(texto){
  return String(texto??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function obtenerBandera(nombre){
  const pais=paises.find(p=>p[0]===nombre);
  return pais?pais[1]:"🌍";
}

function botonVolver(){
  return `<button class="boton-volver" onclick="volver()">← Volver</button>`;
}

function migas(texto){
  return `<div class="breadcrumb">Museo de Parches / <span>${escapar(texto)}</span></div>`;
}

function tarjeta(icono,titulo,descripcion,accion){
  return `
    <button class="tarjeta" onclick="${accion}">
      <span class="icono">${icono}</span>
      <h3>${escapar(titulo)}</h3>
      <p>${escapar(descripcion)}</p>
    </button>
  `;
}

function tarjetaEnlace(icono,titulo,descripcion,archivo){
  return `
    <a class="tarjeta" href="${archivo}">
      <span class="icono">${icono}</span>
      <h3>${escapar(titulo)}</h3>
      <p>${escapar(descripcion)}</p>
    </a>
  `;
}

/* PORTADA */

function inicio(){
  historial=[];

  app.innerHTML=`
    <section class="hero">
      <h2>Bienvenido al Museo de Parches</h2>
      <p>
        Un espacio dedicado a la conservación, catalogación
        y exposición de colecciones militares de diferentes países.
      </p>
    </section>

    <h2 class="seccion-titulo">Explorar colecciones</h2>

    <div class="grid">
      ${tarjeta("🇺🇦","Ucrania","Colección militar ucraniana","pais('Ucrania')")}
      ${tarjeta("🌍","Otros países","Colecciones militares internacionales","otrosPaises()")}
    </div>
  `;
}

/* PAÍS */

function pais(nombre){
  guardar();

  app.innerHTML=`
    ${botonVolver()}
    ${migas(nombre)}

    <div class="pais-cabecera">
      <span class="pais-bandera">${obtenerBandera(nombre)}</span>
      <h2>${escapar(nombre)}</h2>
      <p class="intro">Colección militar de ${escapar(nombre)}</p>
    </div>

    <h2 class="seccion-titulo">Categorías</h2>

    <div class="grid">
      ${
        nombre==="Ucrania"
        ?`
          ${tarjetaEnlace("🏅","Medallas","Condecoraciones y medallas","Ukr5.html")}
          ${tarjeta("⬟","Parches","Parches de unidades militares","parchesUcrania()")}
          ${tarjetaEnlace("⚜","Insignias","Distintivos y emblemas","Ukr6.html")}
          ${tarjetaEnlace("◇","Otros","Otras piezas de colección","Ukr7.html")}
        `
        :categorias.map(c=>tarjeta(
          c[1],c[0],c[2],`categoria('${nombre}','${c[0]}')`
        )).join("")
      }
    </div>
  `;
}

/* NAVEGACIÓN DE PARCHES UCRANIANOS */

function parchesUcrania(){
  guardar();

  app.innerHTML=`
    ${botonVolver()}
    ${migas("Ucrania / Parches")}

    <h2>Ucrania · Parches</h2>
    <p class="intro">
      Selecciona el grupo de unidades que quieres consultar.
    </p>

    <div class="grid">
      ${tarjetaEnlace("🏛️","Cuerpos y mandos","Estructuras de mando","Ukr1.html")}
      ${tarjetaEnlace("🛡️","Brigadas","Parches de brigadas","Ukr2.html")}
      ${tarjetaEnlace("⚔️","Batallones y compañías","Unidades militares","Ukr3.html")}
      ${tarjetaEnlace("🎖️","Otras unidades","Otras formaciones militares","Ukr4.html")}
    </div>
  `;
}

/* OTROS PAÍSES */

function otrosPaises(){
  guardar();

  const lista=paises.filter(p=>p[0]!=="Ucrania");

  app.innerHTML=`
    ${botonVolver()}
    ${migas("Otros países")}

    <h2>Otros países</h2>
    <p class="intro">
      Selecciona un país para consultar sus colecciones militares.
    </p>

    <div class="grid">
      ${lista.map(p=>tarjeta(
        p[1],p[0],"Ver colección",`pais('${p[0]}')`
      )).join("")}
    </div>

    <h2 class="seccion-titulo">Organizaciones internacionales</h2>

    <div class="grid">
      ${organizaciones.map(o=>tarjeta(
        o[1],o[0],"Colección de la organización",`organizacion('${o[0]}')`
      )).join("")}
    </div>
  `;
}

/* CATEGORÍAS DE OTROS PAÍSES */

function categoria(nombre,cat){
  guardar();

  app.innerHTML=`
    ${botonVolver()}
    ${migas(nombre+" / "+cat)}

    <h2>${escapar(cat)}</h2>
    <p class="intro">
      Colección de ${escapar(cat.toLowerCase())} de ${escapar(nombre)}.
    </p>

    <div class="aviso">
      Esta sección está preparada para incorporar
      fotografías y fichas de la colección.
    </div>
  `;
}

/* ORGANIZACIONES */

function organizacion(nombre){
  guardar();

  app.innerHTML=`
    ${botonVolver()}
    ${migas(nombre)}
    <h2>${escapar(nombre)}</h2>

    <div class="aviso">
      Esta sección está preparada para incorporar
      las piezas y fichas de la organización.
    </div>
  `;
}

/* VOLVER */

let historial=[];

function guardar(){
  historial.push(app.innerHTML);
}

function volver(){
  if(historial.length){
    app.innerHTML=historial.pop();
  }else{
    inicio();
  }
}

inicio();
</script>
</body>
</html>
